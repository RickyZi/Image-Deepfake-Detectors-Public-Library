global:
  dataset_path: /dataset-disk/tb_dataset/tf2k_lr/
  # /home/rz/TB_WP3/Image-Deepfake-Detectors-Public-Library/truefake_2k/

  #/media/data/TB_WP3/Image-Deepfake-Detectors-Public-Library/demo_images/season_TM01
