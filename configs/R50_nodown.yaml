  only_list: false

detector_args:
  - "--arch"
  - "res50nodown"
  - "--norm_type"
  - "resnet"
  - "--resize_size"
  - "256"
  - "--resize_ratio"
  - "0.75"
  - "--resize_prob"
  - "0.2"
  - "--cmp_qual"
  - "30,100"
  - "--cmp_prob"
  - "0.5"
  - "--cropSize"
  - "96"
  - "--blur_sig"
  - "0.1,3.0"
  - "--blur_prob"
  - "0.5"
  - "--jitter_prob"
  - "0.8"
  - "--colordist_prob"
  - "0.2"
  - "--cutout_prob"
  - "0.2"
  - "--noise_prob"
  - "0.2"

