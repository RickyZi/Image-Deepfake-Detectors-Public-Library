global:
  dataset_path: /dataset-disk/tb_dataset/tf2k_lr/
  # /datasets-disk/tb_dataset/tf2k_lr/ # ok for vm-inter
  # /home/rz/Image-Deepfake-Detectors-Public-Library/truefake_2k
  # vm intern -> /home/rz/TB_WP3/Image-Deepfake-Detectors-Public-Library/truefake_2k/
  device_override: cuda:0  # null for auto-selection
  min_vram: 16000
  split_file: ./test2k_splits.json # ./split.json
  num_threads: 4 #8
  dry_run: false
  only_list: false

