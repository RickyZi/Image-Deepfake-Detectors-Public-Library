global:
  dataset_path: /dataset-disk/tb_dataset/tf2k_lr/
  device_override: cuda:0  
  min_vram: 16000
  split_file: ./splits/tf2k_splits.json 
  num_threads: 4 #8
  dry_run: false
  only_list: false

detector_args:
  - "--arch"
  - "opencliplinearnext_clipL14commonpool"
  - "--norm_type"
  - "clip"
  - "--resize_size"
  - "200"
  - "--resize_ratio"
  - "1"
  - "--resize_prob"
  - "0.2"
  - "--cmp_qual"
  - "65,100"
  - "--cmp_prob"
  - "0.5"
  - "--resizeSize"
  - "224"

training:
  - data: realFFHQ&realFORLAB&gan1&gan2&gan3&sd15&sd2&sd3&sdXL&flux

testing:
  - realFFHQ&realFORLAB&gan1&gan2&gan3&sd15&sd2&sd3&sdXL&flux 