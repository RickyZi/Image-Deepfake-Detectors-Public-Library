  - "--arch"
  - "opencliplinearloranext_clipL14commonpool_r4_qv"
  - "--norm_type"
  - "clip"
  - "--resize_size"
  - "200"
  - "--resize_ratio"
  - "1"
  - "--resize_prob"
  - "0.2"
  - "--cmp_qual"
  - "65,100"
  - "--cmp_prob"
  - "0.5"
  - "--resizeSize"
  - "224"

